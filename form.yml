---
cluster: "my-k8s-cluster"

form:
  - cpu
  - memory
  - wall_time

attributes:
  # The lesson runs small scripts on a 130 KB dataset; 2 CPUs and 4 GB is
  # plenty, and leaves room for pip installing pandas and matplotlib.
  cpu:
    widget: select
    label: "CPUs"
    options:
      - ["2", "2"]
      - ["4", "4"]
    value: "2"
  memory:
    widget: select
    label: "Memory (GB)"
    options:
      - ["4", "4"]
      - ["8", "8"]
    value: "4"

  wall_time:
    widget: number_field
    label: "Hours"
    min: 1
    max: 12
    value: 8
